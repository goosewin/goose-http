[package]
name = "goose-http"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "1"
bytes = "1"
tokio = { version = "1", features = ["io-util", "net", "macros", "rt", "rt-multi-thread", "time"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = true }
httpdate = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
